[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "fastsite"
version = "0.2.1"
description = "Compiled FastAPI host and controlled extension loader for flight web services"
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "DBUtils>=3.1,<4",
  "cryptography>=41,<45",
  "jinja2>=3.1,<4",
  "pymysql>=1.1,<2",
]

[project.scripts]
fastsite-cli = "fastsite.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
